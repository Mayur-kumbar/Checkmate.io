name: Deploy Checkmate.io

on:
  push:
    branches:
      - main

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: checkmate-backend
  FRONTEND_IMAGE: checkmate-frontend

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- Backend ----------------

      - name: Build backend image
        run: |
          docker build --no-cache -t $DOCKER_USER/$BACKEND_IMAGE:latest ./backend
          docker build --no-cache -t $DOCKER_USER/$BACKEND_IMAGE:$TAG ./backend

      - name: Push backend image
        run: |
          docker push $DOCKER_USER/$BACKEND_IMAGE:latest
          docker push $DOCKER_USER/$BACKEND_IMAGE:$TAG

      # ---------------- Frontend ----------------

      - name: Build frontend image
        run: |
          docker build \
            -t $DOCKER_USER/$FRONTEND_IMAGE:latest \
            -t $DOCKER_USER/$FRONTEND_IMAGE:$TAG \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_SOCKET_URL= \
            ./frontend

      - name: Push frontend image
        run: |
          docker push $DOCKER_USER/$FRONTEND_IMAGE:latest
          docker push $DOCKER_USER/$FRONTEND_IMAGE:$TAG


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Checkmate.io

            echo "Pulling latest images..."
            sudo docker compose pull

            echo "Restarting containers..."
            sudo docker compose up -d --remove-orphans