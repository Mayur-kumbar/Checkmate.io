name: Deploy Checkmate.io

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t mayurkumbar05/checkmate-backend:latest ./backend
          docker push mayurkumbar05/checkmate-backend:latest

      - name: Build frontend image
        run: |
          docker build -t mayurkumbar05/checkmate-frontend:latest --build-arg NEXT_PUBLIC_API_URL=/api --build-arg NEXT_PUBLIC_SOCKET_URL= ./frontend
          docker push mayurkumbar05/checkmate-frontend:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Checkmate.io
            sudo docker compose pull
            sudo docker compose down
            sudo docker compose up -d