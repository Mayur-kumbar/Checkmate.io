events {}

http {
  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name mayurkumbar.tech www.mayurkumbar.tech chess.mayurkumbar.tech;
    return 301 https://$host$request_uri;
  }

  # HTTPS Server
  server {
    listen 443 ssl;
    server_name mayurkumbar.tech www.mayurkumbar.tech chess.mayurkumbar.tech;

    ssl_certificate /etc/letsencrypt/live/mayurkumbar.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mayurkumbar.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Frontend (Next.js)
    location / {
      proxy_pass http://checkmate-frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Backend REST API
    location /api/ {
      proxy_pass http://checkmate-backend:4000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket)
    location /socket.io/ {
      proxy_pass http://checkmate-backend:4000/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}